name: Android CI, APK Artifact & GitHub Release Publisher

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Complete Android Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Build System
        uses: gradle/actions/setup-gradle@v4

      - name: Provision CI Debug Keystore (if not present)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Acceptance Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Verify Debug APK Exists and Is Non-Empty
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Debug APK was not generated or is empty!"
            exit 1
          fi
          cp "$APK_PATH" "app/build/outputs/apk/debug/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk"
          sha256sum "app/build/outputs/apk/debug/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk" > "app/build/outputs/apk/debug/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk.sha256"
          ls -lh "app/build/outputs/apk/debug/"

      - name: Build Signed Release APK (When Signing Secrets Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            gradle :app:assembleRelease
            cp "app/build/outputs/apk/release/app-release.apk" "app/build/outputs/apk/release/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk"
            sha256sum "app/build/outputs/apk/release/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk" > "app/build/outputs/apk/release/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk.sha256"
            rm -f my-upload-key.jks
          else
            echo "Release signing secrets not configured in GitHub Secrets; skipping signed release build."
          fi

      - name: Upload Debug APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dark-tunnel-vpn-config-unlocker-apk
          path: |
            app/build/outputs/apk/debug/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk
            app/build/outputs/apk/debug/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk.sha256
            app/build/outputs/apk/release/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk
            app/build/outputs/apk/release/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release on Version Tag (v*.*.*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Dark Tunnel VPN Config Unlocker (${{ github.ref_name }})"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk
            app/build/outputs/apk/debug/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk.sha256
            app/build/outputs/apk/release/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk
            app/build/outputs/apk/release/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk.sha256
