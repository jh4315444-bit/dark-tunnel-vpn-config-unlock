name: Android CI, APK Artifact & GitHub Release Publisher

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Complete Android Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Provision CI Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Acceptance Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify & Package Debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Debug APK was not generated or is empty!"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" "dist/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk"
          sha256sum "dist/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk" > "dist/dark-tunnel-vpn-config-unlocker-v1.0.0-debug.apk.sha256"
          ls -lh dist/

      - name: Build Signed Release APK (When Signing Secrets Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon
            cp "app/build/outputs/apk/release/app-release.apk" "dist/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk"
            sha256sum "dist/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk" > "dist/dark-tunnel-vpn-config-unlocker-v1.0.0-release.apk.sha256"
            rm -f my-upload-key.jks
          else
            echo "Release signing secrets not configured; skipping signed release build."
          fi

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dark-tunnel-vpn-config-unlocker-apk
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release v1.0.0
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Dark Tunnel VPN Config Unlocker (v1.0.0)"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: dist/*
